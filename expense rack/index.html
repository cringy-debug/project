<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>💰 Expense Tracker 💰</h1>

      <div class="summary">
        <div class="balance-box">
          <h3>Balance</h3>
          <p id="balance">KSH 0.00</p>
        </div>

        <div class="income-box">
          <h3>Income</h3>
          <p id="income">KSH 0.00</p>
        </div>

        <div class="expense-box">
          <h3>Expense</h3>
          <p id="expense">KSH 0.00</p>
        </div>
      </div>

      <form id="transaction-form">
        <h2>Add Transaction</h2>

        <label for="transaction-name">Transaction Name</label>
        <input
          type="text"
          id="name-input-box"
          placeholder="e.g. Salary, Rent, Food"
          required
        />

        <label for="amount">Amount (KSH)</label>
        <input
          type="number"
          id="amount-input-box"
          placeholder="Enter amount"
          required
        />
        <select id="type">
          <option value="income" id="income-opt">income</option>
          <option value="expense" id="expense-opt">expense</option>
        </select>

        <button id="add-btn" type="submit">Add Transaction</button>
      </form>

      <div class="history">
        <h2>Transaction History</h2>

        <p id="transaction-count">Transactions: 0</p>

        <ol id="transaction-list"></ol>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
